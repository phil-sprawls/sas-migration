id: H-MERGE-OVERLAP-01
hazards: [H-MERGE-OVERLAP]
title: a variable in both data sets takes the value of the data set read last
reference: SAS 9.4 Language Reference Concepts, Match-merging (overwriting values)
sas: |
  data out; merge a b; by k; run;
inputs:
  a: {columns: {k: num, v: char(2)}, rows: [[1, 'a1'], [1, 'a2'], [2, 'a3']]}
  b: {columns: {k: num, v: char(2)}, rows: [[1, 'b1'], [3, 'b3']]}
expected:
  out: {columns: [k, v], rows: [[1, 'b1'], [1, 'a2'], [2, 'a3'], [3, 'b3']]}
