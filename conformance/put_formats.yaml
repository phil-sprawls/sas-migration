id: FMT-PUT-01
hazards: [H-ROUND]
title: PUT with w.d (rounded, right aligned), DATE9., Z, COMMA, BEST
reference: SAS 9.4 Formats, w.d / DATEw. / Zw.d / COMMAw.d / BESTw.
sas: |
  data out; set in;
    length f1 $8;
    f1 = put(x, 8.2);
    f2 = put(d, date9.);
    f3 = put(n, z3.);
    f4 = put(1234.5, comma10.2);
    f5 = strip(put(n, best.));
    f6 = put(0.125, 5.2);
  run;
inputs:
  in: {columns: {id: num, x: num, d: num:date9., n: num}, rows: [[1, 3.14159, '15JAN2020', 5]]}
expected:
  out:
    columns: [id, x, d, n, f1, f2, f3, f4, f5, f6]
    keys: [id]
    rows:
      - [1, 3.14159, 21929, 5, '    3.14', '15JAN2020', '005', '  1,234.50', '5', ' 0.13']
