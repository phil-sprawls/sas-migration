id: H-ROUND-01
hazards: [H-ROUND]
title: ROUND half away from zero on the decimal value; INT truncates; MOD keeps the dividend's sign
reference: SAS 9.4 Functions, ROUND / INT / MOD / FLOOR / CEIL
sas: |
  data out;
    r1 = round(2.675, 0.01);
    r2 = round(-2.5);
    r3 = round(1234.5678, 10);
    r4 = round(0.285, 0.01);
    r5 = round(7.4, 0.25);
    i1 = int(-3.7);
    m1 = mod(-5, 3);
    m2 = mod(5, -3);
    f1 = floor(-3.5);
    c1 = ceil(3.2);
  run;
inputs: {}
expected:
  out: {columns: [r1, r2, r3, r4, r5, i1, m1, m2, f1, c1], rows: [[2.68, -3, 1230, 0.29, 7.5, -3, -2, 2, -4, 4]]}
